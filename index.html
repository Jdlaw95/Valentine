<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jy mekeer n Valentine 💖</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(to bottom, #ff758c, #ff7eb3);
    overflow: hidden;
    text-align: center;
  }

  .top {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .top img {
    max-width: 50%;
    max-height: 50%;
    border-radius: 10px;
    animation: bounce 1s infinite alternate;
    transition: opacity 0.8s ease;
  }

  h1 {
    color: white;
    font-size: 2rem;
    margin-bottom: 10px;
  }

  .bottom {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
  }

  button {
    padding: 15px 35px;
    font-size: 1.3rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.25s ease;
    will-change: transform;
  }

  #yesBtn { background-color: #ff2e63; color: white; }
  #noBtn  { background-color: #333; color: white; }

  /* Fireworks behind everything */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 1s ease;
  }

  @keyframes bounce {
    from { transform: translateY(0px); }
    to   { transform: translateY(-15px); }
  }

  @keyframes fadeInMsg {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>

<body>

<div class="top">
  <h1>Jy mekeer n Valentine</h1>
  <img id="mainImage" src="finger.gif.GIF" alt="Finger Pointing" />
</div>

<div class="bottom">
  <h2 style="color:white; margin:0;">Do you have one?</h2>
  <div>
    <button id="yesBtn">YES ❤️</button>
    <button id="noBtn">NO 😢</button>
  </div>
</div>

<canvas id="fireworks"></canvas>

<script>
  // Match your repo filenames exactly:
  const FINGER_FILE = "finger.gif.GIF";
  const REVEAL_FILE = "reveal.JPG";

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const mainImage = document.getElementById("mainImage");
  const topSection = document.querySelector(".top");
  const bottomSection = document.querySelector(".bottom");

  mainImage.src = FINGER_FILE;

  // --- NEW: YES shrinks each click until invisible ---
  let yesClickCount = 0;

  yesBtn.addEventListener("click", function () {
    yesClickCount++;

    const shrink = Math.max(0, 1 - yesClickCount * 0.2);
    yesBtn.style.transform = `scale(${shrink})`;

    if (shrink <= 0.05) {
      yesBtn.style.display = "none";
    }
  });

  // --- NEW: NO triggers the next part (message + image reveal + fireworks) ---
  let didProceed = false;

  noBtn.addEventListener("click", function () {
    if (didProceed) return;
    didProceed = true;

    // Hide the whole bottom section (buttons)
    bottomSection.style.display = "none";

    // Fade out then swap image
    mainImage.style.opacity = "0";
    setTimeout(() => {
      mainImage.src = REVEAL_FILE;
      mainImage.style.opacity = "1";
    }, 800);

    // Message change
    const message = document.createElement("h1");
    message.innerText = "Well in that case 😏❤️";
    message.style.color = "white";
    message.style.marginTop = "20px";
    message.style.opacity = "0";
    message.style.animation = "fadeInMsg 1.3s forwards";
    topSection.appendChild(message);

    startFireworks(3500);
  });

  // ===== FIREWORKS (behind content + fades out) =====
  const canvas = document.getElementById("fireworks");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  let particles = [];
  let intervalId = null;
  let animating = false;

  function createFirework(x, y) {
    for (let i = 0; i < 50; i++) {
      particles.push({
        x, y,
        r: 2,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 90
      });
    }
  }

  function startFireworks(durationMs = 3500) {
    canvas.style.opacity = "1";

    intervalId = setInterval(() => {
      createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.5
      );
    }, 450);

    setTimeout(() => {
      clearInterval(intervalId);
      intervalId = null;

      setTimeout(() => {
        canvas.style.opacity = "0";
      }, 800);
    }, durationMs);

    animate();
  }

  function animate() {
    if (animating) return;
    animating = true;

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
      }

      if (particles.length > 0 || intervalId) {
        requestAnimationFrame(loop);
      } else {
        animating = false;
      }
    }

    requestAnimationFrame(loop);
  }
</script>

</body>
</html>
